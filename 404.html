<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost · Primordia</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#06070c}
  html,body{height:100%}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:32px;color:#dfe6f0;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    background:
      radial-gradient(120% 90% at 15% -10%,rgba(57,224,200,.10),transparent 60%),
      radial-gradient(120% 90% at 85% 0%,rgba(201,139,214,.10),transparent 60%),
      radial-gradient(140% 120% at 50% 120%,rgba(226,97,58,.08),transparent 60%),
      var(--bg)}
  .kicker{font-size:11px;letter-spacing:5px;opacity:.5;text-transform:uppercase}
  .code{font-size:clamp(64px,18vw,150px);font-weight:800;line-height:1;margin:6px 0 4px;
    background:linear-gradient(95deg,#39e0c8,#f3c14b 38%,#e2613a 64%,#c98bd6);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p{max-width:460px;font-size:14px;line-height:1.6;opacity:.75;margin:8px auto 22px}
  a.home{display:inline-block;text-decoration:none;font-size:12px;letter-spacing:1.5px;font-weight:600;
    color:#dfe6f0;padding:11px 20px;border-radius:11px;border:1px solid rgba(255,255,255,.16);
    background:rgba(14,17,26,.6);transition:.18s}
  a.home:hover{border-color:#c98bd6;color:#fff;transform:translateY(-2px);
    box-shadow:0 12px 36px rgba(0,0,0,.5)}
</style>
</head>
<body>
  <div>
    <div class="kicker">this path never emerged</div>
    <div class="code">404</div>
    <p>No rule produced the page you were looking for. The order is back at the
    start &mdash; pick one of the five worlds.</p>
    <a class="home" href="/">&lsaquo; back to Primordia</a>
  </div>
</body>
</html>
